submission:
  title: "PortFlow SBX — Container Congestion Predictor & Port Operations Optimiser"  # REQUIRED

  problem_statement: >                    # REQUIRED — 1-3 sentences. What problem? Who has it?
    San Pedro Bay — the twin Ports of Long Beach and Los Angeles, the largest
    container gateway in the Western Hemisphere — has no single operator view
    connecting vessel arrivals, berth/crane capacity and live congestion. In the
    2021 backlog 100+ container ships waited offshore for weeks (the Marine
    Exchange queue peaked at roughly 109 vessels, with $10B+ in supply-chain
    impact) because hotspots were discovered reactively, berth and crane plans
    were built vessel-by-vessel in spreadsheets, and diversion decisions were
    taken too late to change the economics.

  solution_summary: >                     # REQUIRED — 1-3 sentences. What did you build?
    PortFlow SBX is a 72-hour port-operations cockpit that implements the four
    L1 challenge items end-to-end on the technical plan's stack: a SimPy
    discrete-event simulation generates the synthetic berth/crane/yard/gate
    operations layer over the REAL Port of Long Beach terminal table; a
    LightGBM model with quantile bands forecasts congestion across 24/48/72h;
    a scikit-learn Isolation Forest detects disruptions; a composite risk
    scorer names the binding resource; an OR-Tools CP-SAT solver performs berth
    allocation and quay-crane assignment against hard physical constraints
    (with an honest FIFO baseline). A FastAPI gateway exposes the services to a
    React/Vite dashboard and to Bob, the AI ops assistant, which runs the
    engines and (via Claude) phrases the grounded 72-hour plan.

  key_features:                           # REQUIRED — List 3 to 5 specific features you implemented
    - "72-hour congestion forecasting with LightGBM (point + quantile 0.1/0.9 bands) over a SimPy-simulated operations layer, with a model version, per-horizon MAE/sigma/bias validation and skill vs persistence"
    - "Berth Allocation + Quay Crane Assignment solved exactly with Google OR-Tools CP-SAT under hard constraints (berth length/depth, crane reach, no berth overlap, terminal crane-pool capacity), with a FIFO baseline and measured deltas"
    - "Isolation Forest disruption detection + a composite congestion risk score that attributes the binding resource (berth / crane / yard / gate) rather than just ranking the busiest berth"
    - "Alternate-routing recommender (DIVERT / SLOW_STEAM / PRIORITY_WINDOW / HOLD) priced through a documented $32k/day cost model, requiring sustained (not single-point) congestion"
    - "Bob — a load-bearing AI ops assistant (FastAPI + Claude) that actually runs the engines on every question, answers strictly from their JSON, reports the tools it ran, and degrades to a deterministic engine-derived answer"

  tech_stack:
    languages: ["Python", "TypeScript"]     # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS", "SQLAlchemy", "LightGBM", "scikit-learn", "Google OR-Tools (CP-SAT)", "SimPy"]
    ibm_technologies: ["IBM Bob (invoked via our MCP server)"]  # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["PostgreSQL"]
    other: ["Anthropic Claude (plan narrative, phrasing only)", "psycopg3", "Recharts", "uv", "NOAA AccessAIS data pipeline", "Open-Meteo weather"]

  what_we_are_most_proud_of: >            # Optional but recommended — guides judges to your best work
    The whole stack matches the technical plan: a SimPy discrete-event
    simulation generates the operations layer, LightGBM (with quantile bands)
    forecasts congestion, a scikit-learn Isolation Forest detects disruptions,
    and Google OR-Tools CP-SAT solves the berth-allocation + quay-crane problem
    exactly under hard physical constraints (with an honest FIFO baseline and
    measured deltas). Bob is load-bearing on two surfaces over one shared brain
    (app/services/bob.py): the in-app assistant AND **IBM Bob via our MCP
    server** (app/mcp_server.py exposes 11 engine tools, resources and prompts),
    so Bob actually runs the forecast / CP-SAT optimiser / routing / plan and
    every answer is auditable through the tool-call metadata, with a
    deterministic fallback built from the same engine output.

  known_limitations: >                    # Optional but recommended — be honest about gaps
    The vessel queue and 14-day congestion history are a deterministic,
    clearly-labelled DEMO_AIS layer produced by the SimPy simulation (the
    operational data no public dataset exposes); the real NOAA AccessAIS path is
    documented and shareable to the same schema (source="AIS"). The optimiser
    constrains the four POLB container terminals (13 working berths), not the
    full port-wide 80-berth estate, and models tidal windows only as a draft
    bound. The shipped scenario is deliberately oversubscribed, so CP-SAT
    trades some average wait against makespan/throughput; cargo volume is not
    part of the spec objective. In-memory caching only; vessel ETAs are fixed at
    seed time (no live feed).

