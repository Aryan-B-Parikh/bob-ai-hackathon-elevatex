submission:
  title: "PortPulse AI — Container Congestion Predictor & Port Operations Optimiser"
  problem_statement: >
    San Pedro Bay — the twin Ports of Long Beach and Los Angeles — lacks a single
    operator view connecting vessel arrivals, berth/crane capacity and congestion.
    PortPulse AI turns those signals into a forecast, physically valid berth/crane
    schedule, routing decisions and a 72-hour operating plan.
  solution_summary: >
    PortPulse AI combines a SimPy operations layer, LightGBM congestion forecasting,
    Isolation Forest disruption detection, deterministic bottleneck scoring and
    OR-Tools CP-SAT berth/crane optimisation. IBM Bob is the load-bearing agent:
    through MCP it calls the real engines and explains their computed outputs;
    when Bob is unavailable, the application uses a transparent deterministic
    engine-derived briefing rather than another external LLM.
  key_features:
    - "72-hour LightGBM congestion forecasting with 10th/90th percentile uncertainty bands, per-horizon validation and confidence"
    - "OR-Tools CP-SAT Berth Allocation + Quay Crane Assignment under berth, depth, crane reach, overlap and crane-pool constraints, compared with FIFO"
    - "Isolation Forest disruption detection plus composite hotspot scoring that identifies the binding resource: berth, crane, yard or gate"
    - "Alternate routing decisions (DIVERT / SLOW_STEAM / PRIORITY_WINDOW / HOLD) with sustained-congestion checks and an explicit cost model"
    - "IBM Bob via MCP with 11 operational tools, auditable tool calls and deterministic engine-grounded fallback"
  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS", "SQLAlchemy", "LightGBM", "scikit-learn", "Google OR-Tools (CP-SAT)", "SimPy"]
    ibm_technologies: ["IBM Bob", "Model Context Protocol (MCP)"]
    databases: ["PostgreSQL"]
    other: ["NOAA AccessAIS pipeline", "Open-Meteo", "Recharts", "uv", "psycopg3"]
  what_we_are_most_proud_of: >
    IBM Bob is load-bearing rather than decorative. Bob discovers and invokes
    MCP tools that execute the actual LightGBM forecast, Isolation Forest anomaly
    detection, CP-SAT optimisation, routing engine and 72-hour plan. The agent
    never creates the berth schedule: deterministic optimisation creates the
    schedule, and Bob explains the validated result.
  known_limitations: >
    The shipped demonstration uses a clearly labelled DEMO_AIS synthetic operations
    layer for vessel queue and terminal operations because public data does not expose
    a complete live terminal TOS feed; the NOAA AccessAIS pipeline can replace the
    historical layer. The current optimisation scope covers four POLB container
    terminals and 13 working berths rather than the full port estate. Cold forecast
    execution is about 11 seconds and a cold end-to-end plan can take about 20–30
    seconds; process caching reduces warm requests to about 1 second. This is a
    hackathon prototype, not a production real-time dispatch system. Phase-2 items
    such as full BTS ingestion, live TOS/EDI integration and port-wide coverage are
    intentionally deferred.

