submission:
  title: "PortPulse AI — Container Congestion Predictor & Port Operations Optimiser"

  problem_statement: >
    Port operators must coordinate vessel arrivals, berth capacity, quay cranes,
    yard pressure and routing decisions under uncertainty. Spreadsheet-driven
    planning discovers hotspots reactively and makes diversion or resource
    decisions too late. Primary users are port/terminal operations managers,
    shift supervisors, berth planners, vessel agents and carriers.

  solution_summary: >
    PortPulse AI is a 72-hour port-operations cockpit for San Pedro Bay. A SimPy
    discrete-event layer supplies reproducible operational history, LightGBM
    forecasts congestion with uncertainty, Isolation Forest detects disruptions,
    a composite scorer attributes the binding resource, and OR-Tools CP-SAT
    solves berth and quay-crane assignments against hard constraints with a FIFO
    baseline. IBM Bob is the load-bearing agent: through MCP it selects and calls
    these engines, then synthesizes an evidence-grounded operational decision.

  key_features:
    - "72-hour congestion forecasting with LightGBM point and 0.1/0.9 quantile bands, including per-horizon validation and persistence skill"
    - "Berth Allocation + Quay Crane Assignment solved with Google OR-Tools CP-SAT under berth, depth, crane-reach, overlap and crane-pool constraints, with FIFO comparison"
    - "Isolation Forest disruption detection plus composite congestion risk scoring that identifies the binding berth/crane/yard/gate resource"
    - "Alternate-routing recommender with DIVERT / SLOW_STEAM / PRIORITY_WINDOW / HOLD actions and a documented cost model"
    - "IBM Bob load-bearing agent using MCP tools for forecasting, hotspots, anomalies, optimisation, routing, scenarios, vessel queries, provenance and 72-hour planning"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS", "SQLAlchemy", "LightGBM", "scikit-learn", "Google OR-Tools (CP-SAT)", "SimPy"]
    ibm_technologies: ["IBM Bob", "Model Context Protocol (MCP)"]
    databases: ["PostgreSQL"]
    other: ["psycopg3", "Recharts", "uv", "NOAA AccessAIS import pipeline", "Open-Meteo weather"]

  what_we_are_most_proud_of: >
    Bob is load-bearing rather than a chat wrapper. IBM Bob can select the
    relevant MCP tools, execute the actual forecasting, anomaly, optimisation,
    routing and planning engines, inspect their JSON outputs, and turn them into
    a supervisor-facing decision. The same MCP server exposes operational tools,
    resources and prompts, while tool-call metadata makes the agent interaction
    auditable. If Bob is unavailable, the application uses a transparent
    deterministic briefing over the same engine outputs rather than another LLM.

  known_limitations: >
    The default offline operational history is synthetic and is labelled
    DEMO_AIS; it is not presented as measured AIS. A real NOAA AccessAIS CSV can
    be imported through the AIS ingestion path and is then labelled AIS. The
    optimiser covers four POLB container terminals / 13 working berths rather
    than the complete port-wide estate. Tidal windows are represented through
    depth constraints rather than a dynamically solved harmonic tide model.
    The shipped scenario is deliberately oversubscribed, cargo volume is not
    part of the optimisation objective, caching is in-memory, and vessel ETAs
    are fixed unless new schedule data is uploaded.

