submission:
  title: "PortFlow SBX — Container Congestion Predictor & Port Operations Optimiser"  # REQUIRED

  problem_statement: >                    # REQUIRED — 1-3 sentences. What problem? Who has it?
    San Pedro Bay — the twin Ports of Long Beach and Los Angeles, the largest
    container gateway in the Western Hemisphere — has no single operator view
    connecting vessel arrivals, berth/crane capacity and live congestion. In the
    2021 backlog 100+ container ships waited offshore for weeks (the Marine
    Exchange queue peaked at roughly 109 vessels, with $10B+ in supply-chain
    impact) because hotspots were discovered reactively, berth and crane plans
    were built vessel-by-vessel in spreadsheets, and diversion decisions were
    taken too late to change the economics.

  solution_summary: >                     # REQUIRED — 1-3 sentences. What did you build?
    PortFlow SBX is a 72-hour port-operations cockpit that implements the four
    L1 challenge items end-to-end: (1) a real schedule-aware ridge-regression
    model forecasts congestion hotspots 72 hours ahead with validated 80%
    prediction bands; (2) a rule engine recommends divert / slow-steam /
    priority-window routing priced through a documented $32k/day cost model;
    (3) a three-phase optimiser assigns berths and cranes under real Port of
    Long Beach terminal capacities and reports its measured deltas against a
    FIFO baseline; (4) a 12 x 6-hour shift plan fuses all three for shift
    supervisors. Bob, the AI ops assistant, actually invokes those engines on
    every question and answers strictly from their computed output.

  key_features:                           # REQUIRED — List 3 to 5 specific features you implemented
    - "72-hour congestion hotspot forecasting with a schedule-aware ridge-regression model (14 features including ETA arrival pressure and berth load factor), damped recursive rollout, 80% bands, and per-horizon MAE/sigma/bias validation"
    - "Berth & crane assignment optimiser: FIFO first-fit baseline vs a 3-phase priority-selection / ready-time-sequencing / swap + gap-insertion heuristic under real Port of Long Beach fact-sheet constraints, with a what-if crane/productivity scenario simulator"
    - "Alternate-routing recommender (DIVERT / SLOW_STEAM / PRIORITY_WINDOW / HOLD) priced through a documented $32k/day ship-cost model and a cited alternate-port table"
    - "72-hour operations plan of 12 x 6-hour shifts (arrivals, berthings, crane deployment, congestion alerts, decide-by deadlines, supervisor checklist) as structured JSON and printable text"
    - "Bob — a load-bearing AI ops assistant that actually invokes the forecast / optimiser / routing / plan engines, answers strictly from their JSON, reports the tools it ran, and degrades to a deterministic engine-derived answer when the LLM is unavailable"

  tech_stack:
    languages: ["TypeScript"]             # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["Next.js 16 (App Router)", "React 19", "Tailwind CSS 4", "shadcn/ui", "Prisma"]
    ibm_technologies: ["IBM Bob"]         # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["PostgreSQL"]
    other: ["Bun", "TanStack Query", "Recharts", "next-themes", "z-ai-web-dev-sdk (backend LLM SDK)", "NOAA AccessAIS real-data pipeline"]

  what_we_are_most_proud_of: >            # Optional but recommended — guides judges to your best work
    The forecasting engine is a real trained model, not a lookup table: a
    schedule-aware ridge regression rolled out recursively with ETS-style
    damping, validated on a 48-hour holdout plus 12 multi-origin rollouts
    (R2 ~= 0.90, MAE at 72h ~= 5 index points, +83% skill vs persistence), with
    honest per-horizon error diagnostics in the UI. Equally, Bob is
    load-bearing rather than cosmetic — every answer is produced by actually
    running the engines and is auditable through the tool-call metadata, with a
    deterministic fallback built from the same engine output.

  known_limitations: >                    # Optional but recommended — be honest about gaps
    The vessel queue and 14-day congestion history ship as a deterministic,
    clearly-labelled DEMO_AIS dataset; a real NOAA AccessAIS pipeline
    (src/scripts/ais/) is provided to replace it and is disclosed wherever the data
    appears. Anchorage dwell is interval-approximated (last minus first anchored
    sighting). Anchorage rectangles are documented approximations, not official
    chart polygons. The optimiser constrains 13 working berths at the four POLB
    container terminals, not the full port-wide 80-berth estate, and is a
    heuristic (greedy + local search), not an exact MILP. The shipped scenario is
    deliberately oversubscribed (~3x), so the optimiser maximises throughput and
    priority-weighted fairness rather than raw average wait. Caching is
    in-memory only; the vessel schedule is static (ETAs fixed at seed time).

