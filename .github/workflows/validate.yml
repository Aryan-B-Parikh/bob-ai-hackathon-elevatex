name: ✅ Validate Submission

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Submission + Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "src/backend/uv.lock"

      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync --extra dev

      - name: Run backend tests
        working-directory: src/backend
        run: uv run pytest -q

      - name: Run backend lint
        working-directory: src/backend
        run: uv run ruff check app tests

      - name: Install yq (YAML parser)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Check required files exist
        run: |
          MISSING=()
          REQUIRED_FILES=(README.md submission.yaml docs/problem-statement.md docs/solution-overview.md docs/architecture.md docs/setup-guide.md demo/demo-video-link.txt)
          for f in "${REQUIRED_FILES[@]}"; do
            [ -f "$f" ] || MISSING+=("❌ Missing: $f")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then printf '%s\n' "${MISSING[@]}"; exit 1; fi
          echo "✅ Required submission files present."

      - name: Validate submission.yaml
        run: |
          yq '.' submission.yaml > /dev/null
          ERRORS=()
          check_field() {
            local path="$1" label="$2" val
            val=$(yq "$path" submission.yaml 2>/dev/null)
            if [ -z "$val" ] || [ "$val" = "null" ] || [ "$val" = '""' ]; then ERRORS+=("❌ Missing: $label"); fi
          }
          check_field '.team.name' 'team.name'
          check_field '.team.track' 'team.track'
          check_field '.team.lead.name' 'team.lead.name'
          check_field '.team.lead.email' 'team.lead.email'
          check_field '.submission.title' 'submission.title'
          check_field '.submission.problem_statement' 'submission.problem_statement'
          check_field '.submission.solution_summary' 'submission.solution_summary'
          TRACK=$(yq '.team.track' submission.yaml)
          [[ "$TRACK" =~ ^(AI|DevOps|Sustainability|Open)$ ]] || ERRORS+=("❌ Invalid track: $TRACK")
          FEATURES=$(yq '.submission.key_features | length' submission.yaml)
          [ "$FEATURES" -ge 1 ] || ERRORS+=("❌ No key features")
          if [ ${#ERRORS[@]} -gt 0 ]; then printf '%s\n' "${ERRORS[@]}"; exit 1; fi
          echo "✅ submission.yaml valid."

      - name: Check src contains code
        run: |
          CODE_FILES=$(find src/ -type f ! -name README.md ! -name .env.example | wc -l)
          [ "$CODE_FILES" -ge 1 ] || { echo "❌ src contains no code"; exit 1; }
          echo "✅ src contains $CODE_FILES source files."

      - name: Check demo video link is real
        run: |
          VIDEO_LINK=$(head -1 demo/demo-video-link.txt)
          [[ "$VIDEO_LINK" != *"your-demo-video-link-here"* ]] || { echo "❌ Demo video placeholder remains"; exit 1; }
          echo "✅ Demo video link present: $VIDEO_LINK"

      - name: Check README placeholders
        run: |
          ! grep -q '\[Your Project Title Here\]' README.md || { echo "❌ README project placeholder remains"; exit 1; }
          ! grep -q '\[Your Team Name\]' README.md || { echo "❌ README team placeholder remains"; exit 1; }
          echo "✅ README placeholders replaced."

      - name: Validation passed
        run: |
          echo "🎉 Submission and backend validation passed."
          echo "Team:  $(yq '.team.name' submission.yaml)"
          echo "Title: $(yq '.submission.title' submission.yaml)"
          echo "Track: $(yq '.team.track' submission.yaml)"
