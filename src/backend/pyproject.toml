[project]
name = "portflow-backend"
version = "0.1.0"
description = "PortFlow SBX — FastAPI services: SimPy simulation, LightGBM forecasting, Isolation Forest anomaly detection, OR-Tools CP-SAT berth/crane optimisation, Claude plan narrative."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "ortools>=9.10",
    "simpy>=4.1",
    "anthropic>=0.34",
    "httpx>=0.27",
    "mcp>=2.2.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
